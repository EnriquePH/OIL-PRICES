# Weekly update of the Brent forecast: downloads the latest EIA data,
# refits the models and commits data/, plots/ and output/.

name: Weekly forecast

on:
  schedule:
    - cron: "0 6 * * 0"   # Sundays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readxl
            any::xts
            any::forecast
            any::tseries
            any::ggplot2
            any::plotly
            any::rmarkdown

      - name: Forecast (downloads the latest data)
        run: Rscript Brent.R --update

      - name: Render report
        run: Rscript -e "rmarkdown::render('Brent.Rmd', quiet = TRUE)"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Brent-report
          path: Brent.html

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data plots output
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly forecast $(date -u +%F)"
            git push
          fi
